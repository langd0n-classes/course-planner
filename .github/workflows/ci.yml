name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: cp_hardening
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d cp_hardening"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/cp_hardening
      DATABASE_URL_UNPOOLED: postgresql://agent:agent@127.0.0.1:5432/cp_hardening
      SEED_TEST_DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/cp15
      PGPASSWORD: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run test:demo-db
      - name: Create seed test database
        run: createdb -h 127.0.0.1 -U agent cp15
      - name: Migrate seed test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/cp15
          DATABASE_URL_UNPOOLED: postgresql://agent:agent@127.0.0.1:5432/cp15
      - run: npm run test:seed
